name = "jira-gantt"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# -----------------------------------------------------------------------------
# D1 database binding.
# 1. Run `npm run db:create` once to create the database, then copy the
#    printed database_id below (or into wrangler.production.toml if you keep
#    per-environment files).
# 2. Local dev (`npm run dev`) uses a local SQLite file automatically; you
#    do not need a real database_id to develop locally.
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "jira_gantt_db"
database_id = "c6bc83d3-bd95-450b-9169-dea60e771221"

# -----------------------------------------------------------------------------
# Sign-in: every person logs in with THEIR OWN Jira email + API token.
# Only tokens accepted by this Jira site can sign in, so people outside the
# company cannot get in. Change this to your company's Jira address.
#
# (Optional) Cloudflare Access is still supported: if you ever set
# CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD, Access takes over sign-in.
# -----------------------------------------------------------------------------
[vars]
JIRA_ALLOWED_BASE_URL = "https://franklin.atlassian.net"
# SESSION_DAYS = "90"   # how long a sign-in lasts (default 90)
# CF_ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# CF_ACCESS_AUD = "your-access-application-audience-tag"

# -----------------------------------------------------------------------------
# Secrets must NOT be committed here. Set them with:
#   wrangler pages secret put ENCRYPTION_KEY --project-name=jira-gantt
# For local dev put them in a gitignored .dev.vars file instead (see
# .env.example for the values it needs).
# -----------------------------------------------------------------------------
